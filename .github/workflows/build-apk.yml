name: Build Al-Muhammad APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install project dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Generate Android Native Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔑 Configure Release Signing with Debug Key
        run: |
          # Use debug keystore for release build so it compiles a standalone APK with no external keys needed
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: 🏗️ Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload Installable Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMuhammad-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
